<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — SpiderDB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      document.documentElement.setAttribute('data-theme', localStorage.getItem('spiderdb-theme') || 'dark');
    </script>
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a href="/" class="logo">
            <span class="logo-mark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
                <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
                <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path>
              </svg>
            </span>
            <span class="logo-text gradient-text">SpiderDB</span>
          </a>
        </div>

        <nav class="sidebar-nav">
          <a href="#" class="active" data-view="databases">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>
            Databases
          </a>
          <a href="#" data-view="apikeys">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
            API Keys
          </a>
          <a href="#" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Settings
          </a>
        </nav>

        <div class="sidebar-footer">
          <a href="#" id="logout-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Sign Out
          </a>
        </div>
      </aside>

      <!-- Main -->
      <main class="dashboard-main">
        <header class="dashboard-header">
          <h1 id="page-title">Databases</h1>
          <div class="dashboard-header-actions">
            <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
              <svg data-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
              <svg data-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"></path></svg>
            </button>
            <span id="user-name" style="font-size:0.875rem;font-weight:500;color:var(--text-muted);"></span>
          </div>
        </header>

        <div class="dashboard-content" id="dashboard-content">
          <!-- Content injected by dashboard.js -->
        </div>
      </main>
    </div>

    <!-- Create Database Modal -->
    <div class="modal-overlay" id="create-db-modal">
      <div class="modal">
        <div class="modal-header">
          <h2>Create Database</h2>
          <button class="close-btn" data-close-modal>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="create-db-form">
            <div class="form-group">
              <label for="db-name">Database Name</label>
              <input type="text" id="db-name" name="name" placeholder="my-app-db" required pattern="[a-z0-9-]+" />
              <p class="form-error" id="db-name-error">Only lowercase letters, numbers, and hyphens</p>
            </div>
            <div class="form-group">
              <label for="db-type">Type</label>
              <select id="db-type" name="type">
                <option value="postgresql">PostgreSQL</option>
                <option value="mysql">MySQL</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-close-modal>Cancel</button>
          <button class="btn btn-primary" id="create-db-submit">Create</button>
        </div>
      </div>
    </div>

    <!-- Create API Key Modal -->
    <div class="modal-overlay" id="create-key-modal">
      <div class="modal">
        <div class="modal-header">
          <h2>Create API Key</h2>
          <button class="close-btn" data-close-modal>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="create-key-form">
            <div class="form-group">
              <label for="key-name">Key Name</label>
              <input type="text" id="key-name" name="name" placeholder="Production API" required />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-close-modal>Cancel</button>
          <button class="btn btn-primary" id="create-key-submit">Create</button>
        </div>
      </div>
    </div>

    <!-- API Key Reveal Modal -->
    <div class="modal-overlay" id="reveal-key-modal">
      <div class="modal">
        <div class="modal-header">
          <h2>Your API Key</h2>
          <button class="close-btn" data-close-modal>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <p style="color:var(--text-muted);margin:0 0 1rem;font-size:0.9375rem;">Copy this key now — you won't be able to see it again.</p>
          <div class="code-block" id="revealed-key" style="word-break:break-all;"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="copy-key-btn">Copy to Clipboard</button>
        </div>
      </div>
    </div>

    <!-- Database Detail Modal -->
    <div class="modal-overlay" id="db-detail-modal">
      <div class="modal" style="max-width:48rem;">
        <div class="modal-header">
          <h2 id="detail-db-name">Database</h2>
          <button class="close-btn" data-close-modal>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body" id="db-detail-body">
          <!-- Injected by JS -->
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-close-modal>Close</button>
          <button class="btn btn-danger" id="delete-db-btn">Delete Database</button>
        </div>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
