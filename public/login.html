<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — SpiderDB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      document.documentElement.setAttribute('data-theme', localStorage.getItem('spiderdb-theme') || 'dark');
    </script>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a href="/" class="logo">
          <span class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
              <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
              <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path>
            </svg>
          </span>
          <span class="logo-text gradient-text">SpiderDB</span>
        </a>

        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your SpiderDB account</p>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
            <p class="form-error" id="email-error"></p>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
            <p class="form-error" id="password-error"></p>
          </div>

          <p class="form-error" id="form-error"></p>

          <button type="submit" class="btn btn-primary" id="submit-btn">
            Sign In
          </button>
        </form>

        <p class="auth-footer">
          Don't have an account? <a href="/register.html">Get Started</a>
        </p>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
      (function() {
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          document.querySelectorAll('.form-error').forEach(el => {
            el.classList.remove('visible');
            el.textContent = '';
          });

          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner"></span> Signing in...';

          try {
            const data = await SpiderDB.api('POST', '/api/auth/login', { email, password });
            SpiderDB.setAuth(data.token, data.user);
            SpiderDB.showToast('Welcome back, ' + data.user.name + '!', 'success');
            setTimeout(() => window.location.href = '/dashboard.html', 800);
          } catch (err) {
            const errEl = document.getElementById('form-error');
            errEl.textContent = err.message;
            errEl.classList.add('visible');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
          }
        });
      })();
    </script>
  </body>
</html>
